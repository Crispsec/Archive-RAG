version: '3.8'

services:
  backend:
    image: archivemcp-backend:latest
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_API_KEY=ollama
      - LLM_MODEL=llama3:8b
      - EMBEDDING_MODEL=mxbai-embed-large
      - INTERNAL_API_BASE=http://localhost:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    image: archivemcp-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

volumes:
  qdrant_storage:
